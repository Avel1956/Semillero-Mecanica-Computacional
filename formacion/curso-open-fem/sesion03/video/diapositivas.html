<title>S3 - Pre-procesamiento: geometría, material y malla</title>
<!-- ═══════════════════════════════════════════════════════════════

  Motor: VIDEOMN engine v2 (compartido). NO editar engine.js.

</head><body><script>
// ═══════════════════════════════════════════════════════════════
//  ESCENA 0 — PORTADA: el pre-procesamiento y los agujeros
//  Anclaje: ala de avión con remaches — las grietas nacen en los
//  agujeros (concentración de esfuerzos en toda pieza real)
// ═══════════════════════════════════════════════════════════════
function s0(){
  let t=st,cx=width/2,cy=height*0.38;uFF(t);uFP();
  // — ala de avión: perfil trapezoidal con fila de remaches —
  push();translate(cx,cy);
  fill(40,44,52,150);stroke(cb('blue')[0],cb('blue')[1],cb('blue')[2],80);strokeWeight(2);
  beginShape();
  vertex(-360,-38);vertex(300,-95);vertex(430,-58);vertex(430,-10);vertex(300,-30);vertex(-360,34);
  endShape(CLOSE);
  // remaches: brillan suavemente (los agujeros son concentradores)
  for(let i=0;i<10;i++){
    let rx=-320+i*70,ry=-18-i*6;
    let gp=0.5+0.5*sin(t*2+i*1.7);
    fill(cb('mint')[0],cb('mint')[1],cb('mint')[2],60+120*gp);noStroke();circle(rx,ry,9+3*gp);
    fill(30,34,42,220);circle(rx,ry,6);
  }
  // grieta que nace del remache central (beat narrativo: t>6)
  if(t>6){let ck=constrain(map(t,6,9,0,1),0,1);
    stroke(cb('red')[0],cb('red')[1],cb('red')[2],160*ck);strokeWeight(3);
    let hx=-320+4*70,hy=-18-4*6;
    line(hx,hy,hx+30*ck,hy+8*ck);line(hx+30*ck,hy+8*ck,hx+52*ck,hy-4*ck);
  }
  pop();
  // — panel + títulos —
  let ta=constrain(map(t,1,4,0,200),0,200);
  if(ta>10){fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],ta*0.72);noStroke();rect(cx-560,height*0.66,1120,160,16)}
  txB(window,'Pre-procesamiento',cx,height*0.66+52,60,'gold');
  txB(window,'geometría, material y malla — El 60-70% del tiempo · Sesión 3',cx,height*0.66+118,28,'white');
  // pie: anclaje
  let al0=txa([8,11],t);
  if(al0>20){drawingContext.globalAlpha=al0/255;
    tx(window,'En un ala real, las grietas nacen donde hay agujeros — esta sesión enseña a tratarlos bien',cx,height*0.9,18,'gray');
    drawingContext.globalAlpha=1}
}

// ═══════════════════════════════════════════════════════════════
//  ESCENA 1 — GEOMETRÍA: simplificar con criterio
//  Beats: 1=eliminar, 2=conservar, 3=cita de St. Venant
// ═══════════════════════════════════════════════════════════════
function s1(){
  let t=st,cx=width/2;uFF(t);uFP();
  let elim=['Roscas de tornillos','Redondeos y chaflanes pequeños','Logotipos, grabados, texturas','Agujeros no estructurales'];
  let cons=['Cambios bruscos de sección','Agujeros en zonas de alta tensión','Superficies de contacto','Filetes y radios en zonas críticas'];
  let xL=cx-380,xR=cx+380,y=height*0.20,h=height*0.42;
  // — columna ELIMINAR (beat 1) —
  if(beat>=1){let al=txa([0.3,1.3],t);drawingContext.globalAlpha=al/255;
    let c=cb('red');
    fill(c[0],c[1],c[2],8);stroke(c[0],c[1],c[2],60);strokeWeight(1.5);rect(xL-240,y,480,h,16);
    tx(window,'ELIMINAR (casi siempre)',xL,y+42,30,'red');
    for(let i=0;i<elim.length;i++){let al2=txa([0.5+i*0.35,1.5],t);drawingContext.globalAlpha=al2/255;
      tx(window,'✕  '+elim[i],xL,y+100+i*52,22,'white');}
    drawingContext.globalAlpha=1}
  // — columna CONSERVAR (beat 2) —
  if(beat>=2){let al=txa([0.3,1.3],t);drawingContext.globalAlpha=al/255;
    let c=cb('mint');
    fill(c[0],c[1],c[2],8);stroke(c[0],c[1],c[2],60);strokeWeight(1.5);rect(xR-240,y,480,h,16);
    tx(window,'CONSERVAR (siempre)',xR,y+42,30,'mint');
    for(let i=0;i<cons.length;i++){let al2=txa([0.5+i*0.35,1.5],t);drawingContext.globalAlpha=al2/255;
      tx(window,'✓  '+cons[i],xR,y+100+i*52,22,'white');}
    drawingContext.globalAlpha=1}
  // — cita de St. Venant (beat 3) —
  if(beat>=3){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let yq=height*0.78,c=cb('gold');
    fill(c[0],c[1],c[2],8);stroke(c[0],c[1],c[2],60);strokeWeight(1.5);rect(cx-520,yq,1040,110,14);
    tx(window,'Regla de St. Venant',cx,yq+38,26,'gold');
    tx(window,'“Los detalles geométricos solo afectan localmente.”',cx,yq+82,24,'white');
    drawingContext.globalAlpha=1}
  txB(window,'Geometría: simplificar con criterio',cx,height*0.08,40,'white');
}

// ═══════════════════════════════════════════════════════════════
//  ESCENA 2 — MATERIAL: propiedades con trazabilidad
//  Beats: 1=tabla animada, 2=warning del E nominal
// ═══════════════════════════════════════════════════════════════
function s2(){
  let t=st,cx=width/2;uFF(t);uFP();
  let rows=[['Acero estructural','200–210','0.30','7850','dúctil'],
            ['Aleación de aluminio','68–72','0.33','2700','dúctil'],
            ['Fundición gris','80–140','0.26','≈7100','frágil']];
  let tw=880,ty=height*0.20,rh=76;
  // — tabla (beat 1) —
  if(beat>=1){
    let al=txa([0.3,1.3],t);drawingContext.globalAlpha=al/255;
    fill(30,34,42,140);noStroke();rect(cx-tw/2,ty,tw,rh+rows.length*rh,12);
    stroke(cb('blue')[0],cb('blue')[1],cb('blue')[2],80);strokeWeight(1.5);
    line(cx-tw/2+6,ty+rh,cx+tw/2-6,ty+rh);
    drawingContext.globalAlpha=1;
    tx(window,'Material',cx-tw/2+70,ty+rh/2,19,'gray',LEFT);
    tx(window,'E (GPa)',cx-tw/2+320,ty+rh/2,19,'gray',LEFT);
    tx(window,'ν',cx-tw/2+520,ty+rh/2,19,'gray',LEFT);
    tx(window,'ρ (kg/m³)',cx-tw/2+660,ty+rh/2,19,'gray',LEFT);
    tx(window,'Comportamiento',cx-tw/2+820,ty+rh/2,19,'gray',RIGHT);
    for(let i=0;i<rows.length;i++){
      let al2=txa([0.7+i*0.45,1.8],t);drawingContext.globalAlpha=al2/255;
      let yy=ty+rh+rh*i;
      fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],60);noStroke();rect(cx-tw/2+6,yy+6,tw-12,rh-12,8);
      tx(window,rows[i][0],cx-tw/2+70,yy+rh/2,21,i===2?'red':'white',LEFT);
      tx(window,rows[i][1],cx-tw/2+320,yy+rh/2,21,'white',LEFT);
      tx(window,rows[i][2],cx-tw/2+520,yy+rh/2,21,'white',LEFT);
      tx(window,rows[i][3],cx-tw/2+660,yy+rh/2,21,'white',LEFT);
      tx(window,rows[i][4],cx-tw/2+820,yy+rh/2,21,'gray',RIGHT);
      drawingContext.globalAlpha=1}
  }
  // — warning del E nominal (beat 2) —
  if(beat>=2){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let yw=height*0.66,c=cb('red');
    fill(c[0],c[1],c[2],10);stroke(c[0],c[1],c[2],70);strokeWeight(1.5);rect(cx-520,yw,1040,170,14);
    tx(window,'⚠ Error frecuente: el E “nominal”',cx,yw+42,28,'red');
    tx(window,'Usar 200 GPa cuando la norma especifica un rango (190–210 GPa):',cx,yw+92,22,'white');
    tx(window,'en pandeo o frecuencias naturales esa diferencia es crítica.',cx,yw+130,22,'gray');
    drawingContext.globalAlpha=1}
  txB(window,'Material: propiedades con trazabilidad',cx,height*0.08,40,'white');
}

// ═══════════════════════════════════════════════════════════════
//  ESCENA 3 — TIPOS DE ELEMENTO Y REGLAS DE MALLADO
//  Beats: 1=3 tarjetas (TET4/TET10/HEX8), 2=regla del espesor,
//         3=reglas de curvatura y transición
// ═══════════════════════════════════════════════════════════════
function s3(){
  let t=st,cx=width/2;uFF(t);uFP();
  let cards=[['TET4','1º orden · tetraedro lineal','Mallas automáticas','⚠ demasiado rígido','red'],
             ['TET10','2º orden · tetraedro cuadrático','Buen compromiso','el estándar para 3D','mint'],
             ['HEX8','1º orden · hexaedro','Mallas estructuradas','requiere barrido','blue']];
  // — 3 tarjetas (beat 1) —
  if(beat>=1){
    for(let i=0;i<3;i++){
      let x=cx-430+i*430,y=height*0.20;
      let al=txa([0.3+i*0.35,1.4],t);drawingContext.globalAlpha=al/255;
      let cc=cb(cards[i][4]);
      fill(cc[0],cc[1],cc[2],8);stroke(cc[0],cc[1],cc[2],60);strokeWeight(1.5);
      rect(x-165,y,330,205,16);
      txM(window,cards[i][0],x,y+52,40,cards[i][4]);
      tx(window,cards[i][1],x,y+102,19,'white');
      tx(window,cards[i][2],x,y+142,18,'gray');
      tx(window,cards[i][3],x,y+177,18,cards[i][4]);
      drawingContext.globalAlpha=1}
  }
  // — regla 1: espesor (beat 2) —
  if(beat>=2){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let y=height*0.54;
    fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],90);noStroke();rect(cx-560,y,1120,140,14);
    let px=cx-430,pw=120,ph=100,py=y+20;
    fill(40,44,52,160);stroke(cb('blue')[0],cb('blue')[1],cb('blue')[2],90);strokeWeight(1.5);
    rect(px,py,pw,ph);
    for(let i=1;i<3;i++){line(px,py+ph*i/3,px+pw,py+ph*i/3)}
    line(px+pw*0.5,py,px+pw*0.5,py+ph);
    tx(window,'mínimo 2–3 elementos',px-230,py+ph/2-14,22,'white',RIGHT);
    tx(window,'a través del espesor',px-230,py+ph/2+22,22,'gray',RIGHT);
    tx(window,'regla 1 — paredes delgadas con sólidos',px+pw+60,py+ph/2,22,'gold',LEFT);
    drawingContext.globalAlpha=1}
  // — reglas 2 y 3: curvatura y transición (beat 3) —
  if(beat>=3){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let y=height*0.78;
    fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],90);noStroke();rect(cx-560,y,1120,120,14);
    tx(window,'mínimo 4–5 elementos en un radio de 90°  ·  transición suave ≤ 2× entre adyacentes',cx,y+45,22,'white');
    tx(window,'reglas 2 y 3 — la curvatura y el tamaño no se resuelven por decreto',cx,y+85,18,'gray');
    drawingContext.globalAlpha=1}
  txB(window,'Tipos de elemento y reglas de mallado',cx,height*0.08,40,'white');
}

// ═══════════════════════════════════════════════════════════════
//  ESCENA 4 — LA PLACA CON AGUJERO (concentración de esfuerzos)
//  Beats: 1=placa+agujero+cargas, 2=flujo de fuerzas comprimido,
//         3=valores (Kt≈2.5, σ≈25 MPa), 4=verificación Kt numérico
// ═══════════════════════════════════════════════════════════════
function s4(){
  let t=st,cx=width/2,cy=height*0.40;uFF(t);uFP();
  let pw=520,ph=260,R=52;
  let x0=cx-pw/2,y0=cy-ph/2;
  // — flechas de tracción (beat 1) —
  if(beat>=1){let al=txa([0.3,1.3],t);drawingContext.globalAlpha=al/255;
    for(let i=0;i<5;i++){
      let ay=y0+ph*(i+1)/6;
      stroke(cb('gold')[0],cb('gold')[1],cb('gold')[2],140);strokeWeight(3);noFill();
      line(x0-90,ay,x0-20,ay);line(x0+20,ay,x0+90,ay);
      triangle(x0-20,ay-9,x0-6,ay,x0-20,ay+9);
      triangle(x0+20,ay-9,x0+34,ay,x0+20,ay+9);
    }
    tx(window,'σ = 10 MPa',cx,y0-42,20,'gold');
    drawingContext.globalAlpha=1}
  // — placa y agujero (beat 1) —
  if(beat>=1){let al=txa([0.4,1.4],t);drawingContext.globalAlpha=al/255;
    fill(40,44,52,170);stroke(cb('blue')[0],cb('blue')[1],cb('blue')[2],110);strokeWeight(2);
    rect(x0,y0,pw,ph,6);
    fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],255);stroke(cb('red')[0],cb('red')[1],cb('red')[2],180);strokeWeight(2.5);
    circle(cx,cy,R);
    drawingContext.globalAlpha=1}
  // — líneas de flujo de fuerza que se comprimen en el agujero (beat 2) —
  //    solución de flujo potencial alrededor de cilindro: ψ = y·(1 − R²/(x²+y²))
  if(beat>=2){let al=txa([0.4,1.5],t);drawingContext.globalAlpha=al/255;
    let ny=9;
    for(let li=0;li<ny;li++){
      let yinf=map(li,0,ny-1,-ph/2+30,ph/2-30);
      for(let sx=0;sx<60;sx++){
        let xr=map(sx,0,59,-pw/2+6,pw/2-6);
        // Newton para y·(1 − R²/(x²+y²)) = yinf
        let yg=(abs(yinf)>=R)?yinf:R+max(4,abs(yinf)*0.6);
        for(let k=0;k<6;k++){
          let d2=xr*xr+yg*yg;
          if(d2<1){yg=R+4;continue}
          let f=yg*(1-R*R/d2)-yinf;
          let fp=1-R*R*(xr*xr-yg*yg)/(d2*d2);
          yg-=f/fp;
        }
        // color según proximidad al borde del agujero
        let dEdge=dist(xr,yg,0,0)-R;
        let col=(dEdge<R*0.9)?'red':(dEdge<R*2.2?'gold':'blue');
        let c=cb(col);
        stroke(c[0],c[1],c[2],130);strokeWeight(2);
        point(cx+xr,cy+yg);
      }
    }
    // halo pulsante en el borde del agujero
    let pu=1+0.05*sin(t*3);
    stroke(cb('red')[0],cb('red')[1],cb('red')[2],90);strokeWeight(2.5);noFill();
    circle(cx,cy,R*pu);
    drawingContext.globalAlpha=1}
  // — valores (beat 3) —
  if(beat>=3){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let yv=height*0.76;
    fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],110);noStroke();rect(cx-560,yv,1120,100,14);
    txM(window,'σ_nom = 10 MPa   ·   Kt ≈ 2.5 (Peterson, d/w = 0.2)   ·   σ_máx ≈ 25 MPa',cx,yv+40,23,'gold');
    tx(window,'el pico vive en el borde del agujero — ahí debe ir la malla fina',cx,yv+80,18,'gray');
    drawingContext.globalAlpha=1}
  // — verificación (beat 4) —
  if(beat>=4){let al=txa([0.5,1.6],t);drawingContext.globalAlpha=al/255;
    let yv2=height*0.90;
    fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],110);noStroke();rect(cx-560,yv2,1120,56,12);
    txM(window,'verificación:  Kt numérico = σ_máx FEM / σ_nom  →  error < 5% con malla fina local',cx,yv2+34,19,'mint');
    drawingContext.globalAlpha=1}
  txB(window,'Placa con agujero: la concentración de esfuerzos',cx,height*0.07,40,'white');
}

// ═══════════════════════════════════════════════════════════════
//  ESCENA 5 — CIERRE: la malla es el corazón del FEM + qué sigue
// ═══════════════════════════════════════════════════════════════
function s5(){
  let t=st,cx=width/2,cy=height*0.36;uFF(t);uFP();
  let burst=constrain(map(t,2,5,0,1),0,1);
  glow(g=>{if(burst>0){dB(g,cx,cy,430*burst,cb('mint'),6);dB(g,cx,cy,230*burst,cb('white'),3)}});
  let ta=constrain(map(t,1.5,3.5,0,220),0,220);
  if(ta>10){fill(cb('bg')[0],cb('bg')[1],cb('bg')[2],ta*0.72);noStroke();
    rect(cx-560,cy-70,1120,170,16)}
  drawingContext.globalAlpha=constrain(map(t,1.5,4,0,1),0,1);
  txB(window,'La malla es el corazón del FEM',cx,cy,58,'gold');
  txB(window,'Geometría, material y malla: tres decisiones, un solo resultado confiable',cx,cy+80,26,'white');
  drawingContext.globalAlpha=1;
  // qué sigue
  let al=txa([6,8.5],t);
  if(al>20){drawingContext.globalAlpha=al/255;
    tx(window,'Taller 3: el concentrador de esfuerzos (Kt vs. Peterson) · Sesión 4 → solver y post-procesamiento',cx,height*0.86,21,'gray');
    drawingContext.globalAlpha=1}
}

// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — 6 escenas
// ═══════════════════════════════════════════════════════════════
SNAMES=['Portada','Geometría','Material','Elementos','Placa con agujero','Cierre'];
SBEATS=[1,3,3,3,4,1];
function initSessions(){scenes=[s0,s1,s2,s3,s4,s5];}
</script></body></html>
